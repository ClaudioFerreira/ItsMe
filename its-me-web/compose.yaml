services:
  its-me-web:
    container_name: its-me-web
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.itsme.rule=Host(`claudioferreira.tech`) || Host(`www.claudioferreira.tech`)"
      - "traefik.http.routers.itsme.entrypoints=websecure"
      - "traefik.http.routers.itsme.tls=true"
      - "traefik.http.routers.itsme.tls.certresolver=letsencrypt"
      - "traefik.http.services.itsme.loadbalancer.server.port=3000"