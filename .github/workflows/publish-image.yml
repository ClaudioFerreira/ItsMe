name: Publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - "its-me-web/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./its-me-web
          file: ./its-me-web/dockerfile
          push: true
          tags: |
            ghcr.io/claudioferreira/its-me-web:latest
            ghcr.io/claudioferreira/its-me-web:${{ github.sha }}